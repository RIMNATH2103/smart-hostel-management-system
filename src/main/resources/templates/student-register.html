
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Smart Hostel</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">



    <style>
        /* Student registration layout - matching admin registration */
        .login-page .login-card.registration-card {
            width: 100%;
            max-width: 1200px;
            min-height: 800px;
            flex: 0 1 1200px;
            padding: 45px 50% 45px 55px;
            box-sizing: border-box;
        }

        /* Purple panel on the right */
        .login-page .registration-card::before {
            display: block;
            width: 45%;
        }

        .login-page .registration-card::after {
            display: block;
            width: 35%;
        }

        /* Keep the left-side content properly sized */
        .registration-card .login-heading,
        .registration-card #registrationForm,
        .registration-card .login-footer-text {
            position: relative;
            z-index: 1;
            width: 100%;
            min-width: 0;
        }

        .registration-card .form-group {
            width: 100%;
            margin-bottom: 18px;
        }

        .registration-card .form-group label {
            display: block;
            margin-bottom: 8px;
        }

        .registration-card .form-group input {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 14px 15px;
            box-sizing: border-box;
        }

        .registration-card .login-submit {
            width: 100%;
        }

        .registration-message {
            margin: 12px 0;
            font-size: 14px;
            text-align: center;
        }

        .registration-card a {
            color: #7850bb;
            font-weight: 600;
        }

        /* Responsive layout */
        @media (max-width: 1100px) {
            .login-page .login-card.registration-card {
                max-width: 520px;
                min-height: auto;
                flex: 0 1 520px;
                padding: 40px;
            }

            .login-page .registration-card::before,
            .login-page .registration-card::after {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .login-page .login-card.registration-card {
                padding: 28px 22px;
            }
        }
    </style>


</head>

<body class="login-page">

<header class="navbar">
    <div class="logo">🏠 Smart Hostel</div>
    <nav>
        <a th:href="@{/}" href="/">Home</a>
    </nav>
</header>

<main class="login-container">
    <section class="login-card registration-card">

        <div class="login-heading">
            <div class="login-icon">🎓</div>
            <h1>Student Registration</h1>
            <p>Create your Smart Hostel student account.</p>
        </div>

        <form id="registrationForm">

            <div class="form-group">
                <label for="studentId">Registration Number</label>
                <input type="text"
                       id="studentId"
                       placeholder="EG/20XX/XXXX"
                       pattern="EG/[0-9]{4}/[0-9]{4}"
                       title="Use the format EG/2023/5842"
                       maxlength="12"
                       required>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text"
                       id="fullName"
                       placeholder="Enter your full name"
                       autocomplete="name"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       placeholder="Enter your email"
                       autocomplete="email"
                       required>
            </div>

            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel"
                       id="phoneNumber"
                       placeholder="Enter your phone number"
                       pattern="[0-9]{10,15}"
                       title="Enter 10 to 15 digits, optionally starting with +"
                       autocomplete="tel"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       placeholder="At least 8 characters"
                       minlength="8"
                       autocomplete="new-password"
                       required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password"
                       id="confirmPassword"
                       placeholder="Re-enter your password"
                       minlength="8"
                       autocomplete="new-password"
                       required>
            </div>

            <p id="registrationMessage"
               class="registration-message"
               role="status"
               aria-live="polite"></p>

            <button type="submit"
                    class="login-submit"
                    id="registerButton">
                Create Account
            </button>

        </form>

        <p class="login-footer-text">
            Already have an account?
            <a th:href="@{/student/login}" href="/student/login">
                Sign In
            </a>
        </p>

    </section>
</main>

<script>
    const registrationForm =
        document.getElementById("registrationForm");

    const registrationMessage =
        document.getElementById("registrationMessage");

    const registerButton =
        document.getElementById("registerButton");

    registrationForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const studentId =
            document.getElementById("studentId").value.trim();

        const fullName =
            document.getElementById("fullName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const phoneNumber =
            document.getElementById("phoneNumber").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        registrationMessage.textContent = "";

        if (password !== confirmPassword) {
            registrationMessage.style.color = "#d74759";
            registrationMessage.textContent =
                "Passwords do not match.";
            return;
        }

        registerButton.disabled = true;
        registerButton.textContent = "Creating Account...";

        try {
            const response = await fetch("/api/students/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({
                    studentId: studentId,
                    fullName: fullName,
                    email: email,
                    phoneNumber: phoneNumber,
                    password: password
                })
            });

            const result = await response.text();

            if (response.ok) {
                registrationMessage.style.color = "#17b6a4";
                registrationMessage.textContent =
                    "Registration successful! You can now sign in.";

                registrationForm.reset();
            } else {
                registrationMessage.style.color = "#d74759";
                registrationMessage.textContent =
                    result || "Registration failed. Please try again.";
            }

        } catch (error) {
            registrationMessage.style.color = "#d74759";
            registrationMessage.textContent =
                "Unable to connect to the server. Please try again.";
        } finally {
            registerButton.disabled = false;
            registerButton.textContent = "Create Account";
        }
    });
</script>

</body>
</html>
