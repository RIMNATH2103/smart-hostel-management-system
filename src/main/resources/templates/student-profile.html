
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile | Smart Hostel</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .profile-page {
            min-height: 100vh;
            background: #f5f4fa;
        }

        .profile-navbar {
            background: #7454d6;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .profile-navbar h2 {
            color: white;
            font-size: 22px;
        }

        .back-button {
            background: white;
            color: #7454d6;
            padding: 10px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 600;
        }

        .profile-container {
            max-width: 750px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(40, 30, 70, 0.08);
        }

        .profile-header {
            text-align: center;
            padding-bottom: 28px;
            margin-bottom: 28px;
            border-bottom: 1px solid #e8e6f0;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background: #ede6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 15px;
        }

        .profile-header h1 {
            color: #493477;
            font-size: 28px;
        }

        .profile-role {
            display: inline-block;
            background: #e1f7f2;
            color: #168b83;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 12px;
        }

        .profile-details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .profile-field {
            padding: 18px;
            background: #f8f7fc;
            border-radius: 12px;
            min-width: 0;
        }

        .profile-field label {
            display: block;
            color: #77718a;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .profile-field p {
            color: #263149;
            font-size: 16px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            .profile-card {
                padding: 25px;
            }

            .profile-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="profile-page">

<nav class="profile-navbar">
    <h2>Smart Hostel | Student</h2>

    <a href="/student/dashboard" class="back-button">
        Back to Dashboard
    </a>
</nav>

<main class="profile-container">

    <section class="profile-card">

        <div class="profile-header">
            <div class="profile-avatar">🎓</div>

            <h1 th:text="${student.fullName}">
                Student Name
            </h1>

            <span class="profile-role">
                Hostel Student
            </span>
        </div>

        <div class="profile-details">

            <div class="profile-field">
                <label>Registration Number</label>
                <p th:text="${student.studentId}">
                    EG/2023/0000
                </p>
            </div>

            <div class="profile-field">
                <label>Full Name</label>
                <p th:text="${student.fullName}">
                    Student Name
                </p>
            </div>

            <div class="profile-field">
                <label>Email Address</label>
                <p th:text="${student.email}">
                    student@example.com
                </p>
            </div>

            <div class="profile-field">
                <label>Phone Number</label>
                <p th:text="${student.phoneNumber != null and !student.phoneNumber.isEmpty() ? student.phoneNumber : 'Not provided'}">
                    Not provided
                </p>
            </div>

            <div class="profile-field">
                <label>Current Room</label>
                <p th:text="${roomNumber}">
                    Not allocated
                </p>
            </div>

        </div>

    </section>

</main>

</body>
</html>
