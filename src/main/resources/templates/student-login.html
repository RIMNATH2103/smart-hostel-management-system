
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Smart Hostel</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="login-page">

<header class="navbar">
    <div class="logo">🏠 Smart Hostel</div>

    <nav>
        <a th:href="@{/}" href="/">Home</a>
    </nav>
</header>

<main class="login-container">
    <section class="login-card">
        <div class="login-heading">
            <div class="login-icon">🎓</div>
            <h1>Student Portal</h1>
            <p>Sign in to manage your hostel accommodation.</p>
        </div>

        <form id="studentLoginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="EG/20XX/XXXX"
                        autocomplete="username"
                        pattern="EG/[0-9]{4}/[0-9]{4}"
                        title="Enter your username in the format EG/2023/5842"
                        maxlength="12"
                        required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
            </div>

            <p id="loginMessage" class="login-message"
               role="status" aria-live="polite"></p>

            <button type="submit" class="login-submit">
                Sign In
            </button>
        </form>

        <p class="login-footer-text">
            New to Smart Hostel?
            <span>Registration coming soon</span>
        </p>
    </section>
</main>

</body>
</html>
