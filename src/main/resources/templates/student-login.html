
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Smart Hostel</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="login-page">

<header class="navbar">
    <div class="logo">🏠 Smart Hostel</div>

    <nav>
        <a th:href="@{/}" href="/">Home</a>
    </nav>
</header>

<main class="login-container">
    <section class="login-card">
        <div class="login-heading">
            <div class="login-icon">🎓</div>
            <h1>Student Portal</h1>
            <p>Sign in to manage your hostel accommodation.</p>
        </div>

        <form id="studentLoginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="EG/20XX/XXXX"
                        autocomplete="username"
                        pattern="EG/[0-9]{4}/[0-9]{4}"
                        title="Enter your username in the format EG/2023/5842"
                        maxlength="12"
                        required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
            </div>

            <p id="loginMessage"
               class="login-message"
               role="status"
               aria-live="polite"></p>

            <button type="submit" class="login-submit">
                Sign In
            </button>
        </form>

        <p class="login-footer-text">
            New to Smart Hostel?
            <span>Registration coming soon</span>
        </p>
    </section>
</main>

<script>
    const loginForm = document.getElementById("studentLoginForm");
    const loginMessage = document.getElementById("loginMessage");
    const loginButton = loginForm.querySelector("button[type='submit']");

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        loginMessage.textContent = "";
        loginButton.disabled = true;
        loginButton.textContent = "Signing In...";

        try {
            const response = await fetch("/api/student-auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const result = await response.json();


            if (response.ok) {
                loginMessage.style.color = "#17b6a4";
                loginMessage.textContent = "Login successful!";

                window.location.href = "/student/dashboard";
            }
            else {
                loginMessage.style.color = "#d74759";
                loginMessage.textContent =
                    result.message || "Invalid username or password.";
            }

        } catch (error) {
            loginMessage.style.color = "#d74759";
            loginMessage.textContent =
                "Unable to connect to the server. Please try again.";
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Sign In";
        }
    });
</script>

</body>
</html>
